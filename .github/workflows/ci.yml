name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Vitest test suite (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fast tier only (unit + ui projects) — real cross-file parallelism via
      # the default forks pool, sharded 2-way across runners on top of that.
      # The full-simulation/benchmark/replication files run separately below
      # in "Simulation soak", which is deliberately single-forked and NOT
      # part of this shard split (mixing them in is what caused the 4 GB
      # heap OOM this job used to hit on every push).
      - name: Run test suite
        run: npx vitest run --project unit --project ui --shard=${{ matrix.shard }}/2

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  soak:
    name: Simulation soak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Full-simulation, replication, and analytical-benchmark tests
      # (golden M/M/1 ±2%, M/M/c ±5%, determinism parity, replication CI
      # gates, etc). Runs on every push, in parallel with the "test" job
      # above — this is the project's correctness gate for the engine, not
      # an optional/manual check, so it blocks merge like everything else.
      - name: Run simulation soak suite
        run: npm run test:soak

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [test, soak]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
