name: Flow MCP server

# The local MCP server (mcp/) bundles copies of the engine, validator and
# schema reference. Its downloads are built by the app's own `npm run build`
# (prebuild → build:mcp), so every deploy serves a bundle from the same commit
# and there is nothing to keep in step by hand. This checks the bundled server
# still works end to end (MCP over stdio) whenever anything it bundles changes.
on:
  push:
    paths:
      - "mcp/**"
      - "docs/model-schema-for-llm.md"
      - "src/engine/**"
      - "src/llm/**"
      - "src/model/**"
      - "src/contracts/**"
      - "src/simulation/**"
      - ".github/workflows/mcp-bundle.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "docs/model-schema-for-llm.md"
      - "src/engine/**"
      - "src/llm/**"
      - "src/model/**"
      - "src/contracts/**"
      - "src/simulation/**"
      - ".github/workflows/mcp-bundle.yml"

jobs:
  mcp:
    name: MCP server end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Server works end to end (MCP over stdio)
        run: npm test
      - name: Extension packs and validates
        run: npm run pack
