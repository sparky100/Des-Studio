name: Reference models

# Opt-in full-model regression check (reference-models/README.md). Runs weekly
# and on demand only — never on pushes or pull requests.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Reference model folder to check (blank = all)"
        required: false
        default: ""

jobs:
  reference:
    name: Reference model check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run reference check
        env:
          MODEL: ${{ github.event.inputs.model }}
        run: |
          if [ -n "$MODEL" ]; then
            npm run test:reference -- --model "$MODEL"
          else
            npm run test:reference
          fi
